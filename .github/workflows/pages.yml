name: Suche und Seite auf GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "data/csv/**"
      - "config/**"
      - "site/**"
      - "scripts/90_site.py"
      - "scripts/site_nav.py"
      - "scripts/site_search.py"
      - "scripts/89_suche.py"
      - "fonts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daten für die Seite aus den CSV erzeugen
        run: python scripts/90_site.py
      - name: Startseite mit Suche, bisherige Seite unter korrektur/
        run: |
          mkdir -p _site/korrektur
          cp -R site/. _site/
          cp -R site/. _site/korrektur/
          python scripts/89_suche.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
